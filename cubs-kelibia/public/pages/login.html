<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول - Cubs Kelibia</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="/images/logo.png" alt="فرقة أشبال البساتين" style="width:90px;height:90px;object-fit:contain;border-radius:10px;">
      <h2>تسجيل الدخول</h2>
      <p>أشبال البساتين فوج قليبية</p>
    </div>
    <div id="alerts"></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">📧 البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">🔒 كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-blue btn-lg" style="width:100%" id="login-btn">🔐 دخول</button>
    </form>
    <div id="resend-wrap" style="display:none;margin-top:14px;text-align:center">
      <p style="color:#666;font-size:.83rem;margin-bottom:7px">لم يصلك بريد التأكيد؟</p>
      <button class="btn btn-outline btn-sm" id="resend-btn">📨 إعادة إرسال رسالة التأكيد</button>
    </div>
    <div style="text-align:center;margin-top:22px;color:#666;font-size:.88rem">
      ليس لديك حساب؟ <a href="/pages/register.html" style="color:var(--blue);font-weight:700">إنشاء حساب جديد</a>
    </div>
    <div style="text-align:center;margin-top:7px"><a href="/" style="color:#aaa;font-size:.82rem">← الرئيسية</a></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  if (Auth.loggedIn()) location.href = '/pages/dashboard.html';
  let unverEmail = '';
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '...جاري الدخول';
    try {
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      if (data) { Auth.set(data.token, data.user); toast('مرحباً ' + data.user.full_name, 'success'); setTimeout(() => location.href = '/pages/dashboard.html', 900); }
    } catch (err) {
      toast(err.message, 'error');
      if (err.message.includes('تأكيد')) { unverEmail = document.getElementById('email').value; document.getElementById('resend-wrap').style.display = 'block'; }
      btn.disabled = false; btn.textContent = '🔐 دخول';
    }
  });
  document.getElementById('resend-btn').addEventListener('click', async () => {
    try { const d = await api('/auth/resend-verification', { method: 'POST', body: JSON.stringify({ email: unverEmail }) }); toast(d.message, 'success'); }
    catch (e) { toast(e.message, 'error'); }
  });
</script>
</body>
</html>
