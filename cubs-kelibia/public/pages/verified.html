<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأكيد البريد - Cubs Kelibia</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box" style="text-align:center">
    <div id="ok" style="display:none">
      <div style="font-size:3.8rem;margin-bottom:14px">✅</div>
      <h2 style="color:var(--green);margin-bottom:7px">تم تأكيد البريد الإلكتروني!</h2>
      <p style="color:#555;margin-bottom:22px">حسابك مفعّل. يمكنك تسجيل الدخول الآن.</p>
      <a href="/pages/login.html" class="btn btn-blue btn-lg">🔐 تسجيل الدخول</a>
    </div>
    <div id="err" style="display:none">
      <div style="font-size:3.8rem;margin-bottom:14px">❌</div>
      <h2 style="color:var(--red);margin-bottom:7px">رابط غير صالح</h2>
      <p style="color:#555;margin-bottom:22px">الرابط منتهي الصلاحية أو غير صحيح.</p>
      <a href="/pages/register.html" class="btn btn-blue btn-lg">إنشاء حساب جديد</a>
    </div>
  </div>
</div>
<script>
  const s = new URLSearchParams(location.search).get('status');
  document.getElementById(s === 'success' ? 'ok' : 'err').style.display = 'block';
</script>
</body>
</html>
