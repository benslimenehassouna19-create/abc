<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب - Cubs Kelibia</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="/images/logo.png" alt="فرقة أشبال البساتين" style="width:90px;height:90px;object-fit:contain;border-radius:10px;">
      <h2>إنشاء حساب جديد</h2>
      <p>أشبال البساتين فوج قليبية</p>
    </div>
    <div id="alerts"></div>
    <div id="success-view" style="display:none;text-align:center;padding:18px 0">
      <div style="font-size:3rem;margin-bottom:11px">📧</div>
      <h3 style="color:var(--blue);margin-bottom:7px">تم التسجيل بنجاح!</h3>
      <p style="color:#555;font-size:.9rem">تم إرسال رسالة تأكيد إلى بريدك. يرجى تفعيل حسابك قبل الدخول.</p>
      <a href="/pages/login.html" class="btn btn-blue" style="margin-top:18px">→ تسجيل الدخول</a>
    </div>
    <form id="reg-form">
      <div class="form-group">
        <label class="form-label">👤 الاسم الكامل</label>
        <input type="text" id="full_name" class="form-control" placeholder="الاسم واللقب" required>
      </div>
      <div class="form-group">
        <label class="form-label">📧 البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">🔒 كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="6 أحرف على الأقل" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">🔒 تأكيد كلمة المرور</label>
        <input type="password" id="confirm" class="form-control" placeholder="أعد كتابة كلمة المرور" required>
      </div>
      <button type="submit" class="btn btn-blue btn-lg" style="width:100%" id="reg-btn">📝 إنشاء الحساب</button>
    </form>
    <div style="text-align:center;margin-top:22px;color:#666;font-size:.88rem">
      لديك حساب؟ <a href="/pages/login.html" style="color:var(--blue);font-weight:700">تسجيل الدخول</a>
    </div>
    <div style="text-align:center;margin-top:7px"><a href="/" style="color:#aaa;font-size:.82rem">← الرئيسية</a></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  if (Auth.loggedIn()) location.href = '/pages/dashboard.html';
  document.getElementById('reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (document.getElementById('password').value !== document.getElementById('confirm').value)
      return toast('كلمتا المرور غير متطابقتين', 'error');
    const btn = document.getElementById('reg-btn');
    btn.disabled = true; btn.textContent = '...جاري التسجيل';
    try {
      const d = await api('/auth/register', { method: 'POST', body: JSON.stringify({ full_name: document.getElementById('full_name').value, email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      if (d) {
        if (d.autoVerified) {
          toast('تم التسجيل بنجاح! جاري توجيهك...', 'success');
          setTimeout(() => location.href = '/pages/login.html', 1200);
        } else {
          document.getElementById('reg-form').style.display = 'none';
          document.getElementById('success-view').style.display = 'block';
        }
      }
    } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = '📝 إنشاء الحساب'; }
  });
</script>
</body>
</html>
